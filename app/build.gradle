apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin:  'com.chaquo.python'
def hilt_version = '2.56'
def nav_version = '2.8.9'
def room_version = '2.7.0'
def work_version = '2.10.0'

def gitHash = { ->
    try {
        def proc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootProject.projectDir)
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim() : "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace "com.carditek.kesar"
    compileSdk = 36

    lint {
        // Production baseline: fail builds on important issues.
        abortOnError true
        checkReleaseBuilds true
    }

    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }

    defaultConfig {
        versionName "6.0.0"
        applicationId "com.carditek.kesar"
        // API 21+ (Android 5.0+). Modern AndroidX / BLE stack; do not lower without major rework.
        minSdk 26

        targetSdk 35
        versionCode 1
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        python {
            buildPython "C:\\python\\python.exe"
            pip {
                install "numpy"
                install "scipy"
                install "pandas"
                install "matplotlib"
                install "PyWavelets"
                install "condat_tv"

            }
        }
        buildConfigField "String", "APP_VERSION_NAME", "\"${versionName}\""
        buildConfigField "String", "GIT_HASH", "\"${gitHash()}\""
        // Optional (should NOT be set for production builds): Telegram debug notifications.
        // Pass via Gradle properties (e.g. -PTELEGRAM_BOT_TOKEN=... -PTELEGRAM_CHAT_ID=...)
        def telegramBotToken = project.findProperty("TELEGRAM_BOT_TOKEN") ?: ""
        def telegramChatId = project.findProperty("TELEGRAM_CHAT_ID") ?: ""
        // If TELEGRAM_ENABLED is set in gradle.properties, use it; otherwise auto-enable when token + chat are set.
        def enabledProp = project.findProperty("TELEGRAM_ENABLED")
        def telegramEnabled = (enabledProp != null)
            ? enabledProp.toString().toBoolean()
            : (!telegramBotToken.toString().isEmpty() && !telegramChatId.toString().isEmpty())
        buildConfigField "String", "TELEGRAM_BOT_TOKEN", "\"${telegramBotToken}\""
        buildConfigField "String", "TELEGRAM_CHAT_ID", "\"${telegramChatId}\""
        buildConfigField "boolean", "TELEGRAM_ENABLED", "${telegramEnabled}"
        testInstrumentationRunner "com.carditek.kesar.TestRunner"

        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def apkName = "Sydäntek.apk"
            outputFileName = apkName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }
}

dependencies {

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:okhttp-urlconnection:4.12.0")
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation "com.google.android.material:material:1.12.0"
    androidTestImplementation 'androidx.test:rules:1.6.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.55'
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"

    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    kaptTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"

    implementation "androidx.work:work-runtime-ktx:$work_version"
    androidTestImplementation "androidx.work:work-testing:$work_version"
    androidTestImplementation "androidx.work:work-multiprocess:$work_version"
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-guava:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-idling-resource:3.6.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'

    constraints {
        implementation('junit:junit:4.13.2')
        implementation 'com.google.guava:guava:33.3.1-android'
        testImplementation 'com.google.guava:guava:33.3.1-android'
        androidTestImplementation 'com.google.guava:guava:33.3.1-android'
        androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.1'
    }
}

kapt {
    correctErrorTypes true
}
