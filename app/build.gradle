apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def gitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

android {
    lint {
        abortOnError false // Don't fail build on lint errors
        checkReleaseBuilds false // Don't run lint on release builds
    }
    compileSdkVersion 31
    buildToolsVersion "31.0.0"
    namespace "com.carditek.kesar"
    buildFeatures {
        buildConfig true          // <‑‑ add this line
        dataBinding true
        viewBinding true
    }
    defaultConfig {
        versionName "4.0.0"

        applicationId "com.carditek.kesar"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
//        buildConfigField "String", "APP_VERSION_NAME", "\"${versionName}\""
//        buildConfigField "String", "GIT_HASH", "\"${gitHash()}\""
        buildConfigField "String", "APP_VERSION_NAME", "\"${versionName}\""
        buildConfigField "String", "GIT_HASH",        "\"${gitHash()}\""
        testInstrumentationRunner "com.carditek.kesar.TestRunner"

        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }
    // Custom APK naming
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def buildType = variant.buildType.name
            // def date = new Date().format('yyyy-MM-dd_HH-mm')

            // Custom APK name format
//            def apkName = "sydantek_${versionName}_${buildType}_${date}.apk"
            def apkName = "sydantek.apk"
            outputFileName = apkName
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    packagingOptions {
        exclude "META-INF/AL2.0"
        exclude "META-INF/LGPL2.1"
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }
}

dependencies {


    implementation("com.squareup.okhttp3:okhttp:4.12.0")//mac id message perpose
//    implementation "org.apache.poi:poi-ooxml:3.1.7"
//    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.0" // for lifecycleScope
    androidTestImplementation 'androidx.test:rules:1.4.1-alpha03'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.2"
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.preference:preference-ktx:1.1.1"
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.12.21'
    implementation "com.google.android.gms:play-services-auth:20.0.0"
    implementation "com.google.android.material:material:1.4.0"
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.0.0-alpha.2'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.2'
    implementation platform("com.google.firebase:firebase-bom:26.1.0")

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.5.0"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.5.0"
    testImplementation "androidx.arch.core:core-testing:2.1.0"
    androidTestImplementation "androidx.arch.core:core-testing:2.1.0"

    // Android + Kotlin Hilt Dependency Injection Support
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Hilt Support for Robolectric + Instrumented Tests
    kaptTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"

    // Android Architecture Components: Work Manager
    implementation "androidx.work:work-runtime-ktx:$work_version"
    androidTestImplementation "androidx.work:work-testing:$work_version"
    androidTestImplementation "androidx.work:work-multiprocess:$work_version"
    implementation 'androidx.hilt:hilt-work:1.0.0'
    kapt 'androidx.hilt:hilt-compiler:1.0.0'

    // Android Architecture Components: Room
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"


    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.4.0"
    androidTestImplementation "androidx.test.espresso:espresso-idling-resource:3.4.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    constraints {
        implementation('junit:junit:4.13.2')

        implementation 'com.google.guava:guava:31.1-android'
        testImplementation 'com.google.guava:guava:31.1-android'
        androidTestImplementation 'com.google.guava:guava:31.1-android'
        //implementation "androidx.room:room-guava:$room_version"
        implementation "androidx.room:room-guava:2.4.0"

        androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.5.2'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.5.2'


        androidTestImplementation 'com.google.guava:guava:31.1-android'


        androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.5.2'

    }
}

kapt {
    correctErrorTypes true
}








